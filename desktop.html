<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AmaarOS Desktop</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .top-bar {
      width: 100%;
      height: 40px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 14px;
    }

    .sidebar {
      width: 70px;
      height: calc(100vh - 40px);
      background: #181818;
      position: fixed;
      top: 40px;
      left: 0;
      display: flex;
      flex-direction: column;
      padding-top: 10px;
      gap: 15px;
      align-items: center;
    }

    .app-icon {
      width: 45px;
      height: 45px;
      background: #333;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .app-icon:hover {
      background: #444;
    }

    #logoutBtn {
      background: #ff4444;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="userDisplay">Loading user...</div>
    <div id="logoutBtn">Logout</div>
  </div>

  <div class="sidebar">
    <div class="app-icon">⚙️</div>
    <div class="app-icon">📁</div>
    <div class="app-icon">🕹️</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    const userDisplay = document.getElementById("userDisplay");
    const logoutBtn = document.getElementById("logoutBtn");

    // 🔥 Detect logged-in user
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.isAnonymous) {
          userDisplay.textContent = "Logged in as: Guest";
        } else {
          userDisplay.textContent = "Logged in as: " + user.email;
        }
      } else {
        window.location.href = "login.html"; // redirect if not logged in
      }
    });

    // 🔥 Logout button
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });
  </script>

</body>
</html>

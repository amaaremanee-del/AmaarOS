<!DOCTYPE html>
<html>
<head>
  <title>AmaarOS Desktop</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #4b6cb7, #182848);
      color: white;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      opacity: 0.9;
    }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      width: 300px;
      margin: 40px auto;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #f97316;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Welcome to AmaarOS!</h1>
  <p>You are logged in.</p>

  <div class="box">
    <p>This is your new desktop page.</p>
    <p>Next step: add apps, sidebar, and username.</p>
    <button onclick="location.href='login.html'">Log out</button>
  </div>

</body>
</html>

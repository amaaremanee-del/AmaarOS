<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AmaarOS Desktop</title>

  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    /* Top bar */
    .top-bar {
      width: 100%;
      height: 45px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-size: 15px;
      border-bottom: 1px solid #222;
    }

    /* Sidebar */
    .sidebar {
      width: 80px;
      height: calc(100vh - 45px);
      background: #181818;
      position: fixed;
      top: 45px;
      left: 0;
      display: flex;
      flex-direction: column;
      padding-top: 15px;
      gap: 20px;
      align-items: center;
      border-right: 1px solid #222;
    }

    .app-icon {
      width: 50px;
      height: 50px;
      background: #2a2a2a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      transition: 0.2s;
    }

    .app-icon:hover {
      background: #3a3a3a;
    }

    #logoutBtn {
      background: #ff4444;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div id="userDisplay">Loading user...</div>
    <div id="logoutBtn">Logout</div>
  </div>

  <div class="sidebar">
    <div class="app-icon">⚙️</div>
    <div class="app-icon">📁</div>
    <div class="app-icon">🕹️</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    const userDisplay = document.getElementById("userDisplay");
    const logoutBtn = document.getElementById("logoutBtn");

    // 🔥 Detect logged-in user
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userDisplay.textContent = "Logged in as: " + user.email;
      } else {
        window.location.href = "/AmaarOS/login.html"; 
      }
    });

    // 🔥 Logout button
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "/AmaarOS/login.html";
      });
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>AmaarOS</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center-box {
      width: 300px;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button.secondary {
      background: #1f2937;
    }
  </style>
</head>
<body>

  <div class="center-box">
    <h2>Welcome to AmaarOS</h2>

    <button onclick="location.href='login.html'">Login</button>
    <button class="secondary" onclick="location.href='signup.html'">Create Account</button>
  </div>

</body>
</html>

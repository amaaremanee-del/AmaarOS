<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AmaarOS File Explorer</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #files {
      margin-top: 10px;
      background: #1f1f1f;
      border-radius: 8px;
      padding: 10px;
    }
    .file {
      padding: 8px;
      border-bottom: 1px solid #333;
      cursor: default;
      font-size: 14px;
    }
    .file:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <h1>File Explorer</h1>
  <div id="files">
    <div class="file">desktop.html</div>
    <div class="file">about.html</div>
    <div class="file">browser.html</div>
    <div class="file">settings.html</div>
    <div class="file">file_explorer.html</div>
    <div class="file">firebase.js</div>
    <div class="file">icons/</div>
    <div class="file">wallpaper.jpg</div>
  </div>
</body>
</html>

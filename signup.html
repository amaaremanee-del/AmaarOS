<!DOCTYPE html>
<html>
<head>
  <title>Create Account - AmaarOS</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      color: #e5e7eb;
    }

    .center-box {
      width: 300px;
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button.secondary {
      background: #1f2937;
    }

    a {
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="center-box">
    <h2>Create Account</h2>

    <label>Email</label>
    <input id="email">

    <label>Password</label>
    <input id="password" type="password">

    <button id="signupBtn">Create Account</button>
    <button class="secondary" onclick="location.href='login.html'">Back</button>

    <p id="status"></p>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("status");
    const signupBtn = document.getElementById("signupBtn");

    signupBtn.onclick = () => {
      status.textContent = "";
      createUserWithEmailAndPassword(auth, email.value, password.value)
        .then(() => {
          status.textContent = "Account created! Redirecting...";
          setTimeout(() => {
            location.href = "login.html";
          }, 800);
        })
        .catch(err => {
          status.textContent = err.message;
        });
    };
  </script>

</body>
</html>

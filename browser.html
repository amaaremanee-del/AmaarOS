<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AmaarOS Browser</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1b1b1b;
      color: #fff;
    }
    #bar {
      background: #2a2a2a;
      padding: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #url {
      flex: 1;
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      outline: none;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background: #4a8cff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #3a72d1;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 40px);
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="bar">
    <input id="url" placeholder="Enter a website (example: google.com)">
    <button onclick="loadSite()">Go</button>
  </div>
  <iframe id="view"></iframe>

  <script>
    function loadSite() {
      const input = document.getElementById('url').value.trim();
      if (!input) return;
      const url = input.startsWith('http') ? input : 'https://' + input;
      document.getElementById('view').src = url;
    }
  </script>
</body>
</html>

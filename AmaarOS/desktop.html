<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AmaarOS Desktop</title>

  <style>
    body {
      margin: 0;
      background: url('wallpaper.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Desktop Grid */
    #desktop {
      display: grid;
      grid-template-columns: repeat(auto-fill, 120px);
      gap: 30px;
      padding: 40px;
    }

    /* Icons */
    .icon {
      width: 120px;
      text-align: center;
      color: white;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .icon img {
      width: 70px;
      height: 70px;
      margin-bottom: 8px;
      filter: drop-shadow(0px 0px 4px black);
    }

    .icon:hover {
      transform: scale(1.1);
      opacity: 0.9;
    }

    /* Taskbar */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px;
      backdrop-filter: blur(12px);
      background: rgba(20, 20, 20, 0.45);
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-shadow: 0px -2px 10px rgba(0,0,0,0.4);
    }

    #start-btn {
      width: 45px;
      height: 45px;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: black;
    }

    #clock {
      margin-left: auto;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding-right: 10px;
    }
  </style>
</head>

<body>

  <!-- Desktop Icons -->
  <div id="desktop">
    <div class="icon" onclick="openApp('settings')">
      <img src="icons/settings.png">
      <p>Settings</p>
    </div>

    <div class="icon" onclick="openApp('files')">
      <img src="icons/files.png">
      <p>Files</p>
    </div>

    <div class="icon" onclick="openApp('browser')">
      <img src="icons/browser.png">
      <p>Browser</p>
    </div>

    <div class="icon" onclick="openApp('about')">
      <img src="icons/info.png">
      <p>About</p>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="start-btn">☰</div>
    <div id="clock"></div>
  </div>

  <script>
    function openApp(app) {
      window.location.href = app + ".html";
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText =
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
